<style>

/* ============================================================
   General
   ============================================================ */

body {
    font-family: Arial, sans-serif;
    margin: 30px;
    overflow-x: auto;
}

/* ============================================================
   Navigation tabs
   ============================================================ */

.tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 25px;
    border-bottom: 2px solid #888;
}

.tab {
    display: block;
    padding: 10px 18px;

    text-decoration: none;
    color: black;

    background: #ddd;
    border: 1px solid #aaa;
    border-bottom: none;

    border-radius: 6px 6px 0 0;
}

.tab:hover {
    background: #ccc;
}

.tab.active {
    background: white;
    font-weight: bold;

    position: relative;
    top: 2px;
}

/* ============================================================
   Table
   ============================================================ */


table {
    border-collapse: collapse;
    width: max-content;
}

th,
td {
    border: 2px solid black;
}

th {
    background: #f0f0f0;
    padding: 10px;
    min-width: 170px;
}

.rowlabel {
    font-weight:bold;
    min-width:140px;
    max-width:200px;
    text-align:center;
    padding:10px;
}

.rowname {
    font-size: 1em;
}

.rowinfo {
    margin-top:8px;
    font-style:italic;
    font-weight:normal;
    font-size:0.85em;
    color:#555;
    white-space:pre-line;
}

.cell {
    min-width: 170px;
    min-height: 160px;
    max-width:500px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    padding: 10px;
    box-sizing: border-box;
}

.images {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    margin-bottom: 8px;
}

.images img {
    max-width:150px;
    max-height:200px;
    border: 1px solid #888;
}

.text {
    text-align:center;
    white-space:pre-wrap;
    word-break:break-word;
    font-weight:normal;
    font-size:0.85em;
    color:#555;
}

/* ============================================================
   Gallery pages
   ============================================================ */

.gallery-header {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 15px;
    margin-bottom: 10px;
    margin-top: 20px;
    padding: 10px;
    border: 4px solid #e88ab5;
    border-radius: 12px;
}

.gallery-header img {
    max-width: 300px;
    max-height: 250px;
    object-fit: contain;
}

.gallery {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    border: 4px solid #78eb85;
    border-radius: 12px;
    padding: 10px;
}

.gallery img {
    max-width: 200px;
    max-height: 200px;
    object-fit: contain;
}

.gallery-stats {
    border-collapse: collapse;
}
.gallery-stats td {
    padding: 2px 8px;
}
.gallery-stats td:first-child {
    text-align: left;
}
.gallery-stats td:last-child {
    text-align: right;
}

</style>

</head>
